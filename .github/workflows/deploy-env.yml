# Deploys one environment, dev or prod: the D1 migrations, then the Worker
# with the viewer and the parser container. Called by deploy.yml.
name: deploy-env

on:
  workflow_call:
    inputs:
      environment:
        description: dev or prod
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: deploy ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      ENV_NAME: ${{ inputs.environment }}
      # The top level of worker/wrangler.jsonc is dev.
      WRANGLER_ENV: ${{ inputs.environment == 'prod' && 'prod' || '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            web/package-lock.json
      - name: Install the Worker and viewer
        run: |
          npm ci --prefix worker
          npm ci --prefix web

      # FAULT makes every parse fail on purpose, for dev's recovery checks.
      - name: Refuse the fault flag in prod
        if: inputs.environment == 'prod'
        working-directory: worker
        run: |
          if npx wrangler secret list --env prod | grep -q '"FAULT"'; then
            echo "::error::FAULT is set on prod. Remove it: wrangler secret delete FAULT --env prod"
            exit 1
          fi

      - name: Apply D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply DB --remote --env="$WRANGLER_ENV"

      # deploy:<env> builds the viewer, then wrangler builds the parser image
      # from parser/Dockerfile with the runner's Docker, pushes it to
      # Cloudflare's registry and rolls the container out with the Worker.
      # PARSER_BUILD hashes the git trees of the parser's code, so only a change
      # there makes the reparse cron parse every match again.
      - name: Deploy the Worker, viewer and parser container
        working-directory: worker
        run: |
          build="$(git rev-parse HEAD:parser HEAD:tools/oracle | sha256sum | cut -c1-12)"
          echo "PARSER_BUILD=${build}"
          npm run "deploy:${ENV_NAME}" -- --var "PARSER_BUILD:${build}"
