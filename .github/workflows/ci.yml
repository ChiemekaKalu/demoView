# Checks for every pull request and every push to a branch other than main
# or a research branch: the spec's "Pull request" row. Research branches never
# merge and bring their own workflow, so these would only take runner slots. Each part of the repo is its own job, so
# they run in parallel. Pushes to main run these same checks from
# deploy.yml (workflow_call), which deploys only if they all pass.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main, "research/**"]
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch cancels older checks. Called from
# deploy.yml, github.workflow is "deploy": a separate group, never
# cancelled, so a deploy is never stopped halfway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'ci' }}

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  parser:
    name: parser (Go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: parser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: parser/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # Tests that need demos skip: fixture demos are not in git.
      - run: go test ./...

  # The diff test (checkpoint 1.8): our parser against the oracle on every
  # fixture demo in the demoview-fixtures bucket. Without the bucket's
  # credentials (forks, a new repo) it skips with a notice instead of failing.
  diff:
    name: parser diff (fixtures)
    runs-on: ubuntu-24.04
    env:
      FIXTURES_R2_ACCESS_KEY_ID: ${{ secrets.FIXTURES_R2_ACCESS_KEY_ID }}
      FIXTURES_R2_SECRET_ACCESS_KEY: ${{ secrets.FIXTURES_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for fixture credentials
        id: creds
        run: |
          if [ -n "$FIXTURES_R2_ACCESS_KEY_ID" ] && [ -n "$FIXTURES_R2_SECRET_ACCESS_KEY" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=parser diff skipped::Set FIXTURES_R2_ACCESS_KEY_ID, FIXTURES_R2_SECRET_ACCESS_KEY and CLOUDFLARE_ACCOUNT_ID to run it."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-go@v7
        if: steps.creds.outputs.ok == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            parser/go.sum
            tools/oracle/go.sum
      - name: Download the fixture demos
        if: steps.creds.outputs.ok == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FIXTURES_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FIXTURES_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp s3://demoview-fixtures/demos/ "$RUNNER_TEMP/demos/" --recursive \
            --exclude "*" --include "*.dem" \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
      - name: Build the parser CLI and the oracle
        if: steps.creds.outputs.ok == 'true'
        run: |
          (cd parser && go build -o "$RUNNER_TEMP/demo" ./cmd/demo)
          (cd tools/oracle && go build -o "$RUNNER_TEMP/oracle" .)
      - name: Diff each fixture against the oracle
        if: steps.creds.outputs.ok == 'true'
        run: |
          shopt -s nullglob
          demos=("$RUNNER_TEMP"/demos/*.dem)
          if [ ${#demos[@]} -eq 0 ]; then
            echo "::error::no .dem files under s3://demoview-fixtures/demos/"
            exit 1
          fi
          status=0
          for dem in "${demos[@]}"; do
            name="$(basename "$dem" .dem)"
            ref="$RUNNER_TEMP/reference/$name"
            echo "::group::$name"
            "$RUNNER_TEMP/oracle" export "$dem" --out "$ref" > /dev/null
            # Exit 0 on a match, 1 with a report on stdout on a mismatch.
            "$RUNNER_TEMP/demo" diff "$dem" --against "$ref/match.json" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  oracle:
    name: tools/oracle (Go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/oracle
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tools/oracle/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  schema:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: schema
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: schema/package-lock.json
      - run: npm ci
      - run: npm test

  worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  # Builds the parser container image without pushing it. The context is the repo
  # root; BuildKit trims it with parser/Dockerfile.dockerignore.
  docker:
    name: parser image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: parser/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
