# Checks for every pull request and every push to a branch other than main:
# the spec's "Pull request" row. Each part of the repo is its own job, so
# they run in parallel. main is covered by deploy.yml.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  parser:
    name: parser (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parser
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: parser/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # Tests that need demos skip: fixture demos are not in git.
      - run: go test ./...

  # The parser diff test (checkpoint 1.8) goes here: `demo diff` against the
  # oracle on the fixture demos, pulled from their R2 bucket with
  # FIXTURES_R2_ACCESS_KEY_ID and FIXTURES_R2_SECRET_ACCESS_KEY.

  oracle:
    name: tools/oracle (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/oracle
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tools/oracle/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  schema:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schema
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: schema/package-lock.json
      - run: npm ci
      - run: npm test

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  # Builds the Cloud Run image without pushing it. The context is the repo
  # root; BuildKit trims it with parser/Dockerfile.dockerignore.
  docker:
    name: parser image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: parser/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
