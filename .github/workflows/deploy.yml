# Deploys on every push to main: the spec's "Merge to main" row. Nothing
# deploys unless every CI check passes first (commits go straight to main,
# with no pull request). Then dev is deployed and, only if that succeeds,
# prod. See .github/README.md for the secrets and one-time setup.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once, and never cancel one halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  dev:
    needs: ci
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
    secrets: inherit

  prod:
    needs: dev
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
    secrets: inherit
